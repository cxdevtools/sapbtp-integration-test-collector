---
applications:
  - name: sapbtp-integration-test-collector
    path: .
    buildpacks:
      - nodejs_buildpack
    memory: 64M
    instances: 1
    command: npm start
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      NODE_ENV: production
      COLLECTOR_TTL_HOURS: "2"
