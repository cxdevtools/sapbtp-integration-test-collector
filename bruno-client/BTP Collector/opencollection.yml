opencollection: 1.0.0

info:
  name: BTP Collector
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: messageId
      value: bruno-123456789
    - name: runId
      value: bruno-testrun
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
