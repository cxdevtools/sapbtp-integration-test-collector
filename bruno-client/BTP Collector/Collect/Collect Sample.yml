info:
  name: Collect Sample
  type: http
  seq: 1

http:
  method: POST
  url: "{{btp-host}}/collect/Inbound/Product"
  headers:
    - name: SAP_RunId
      value: "{{runId}}"
    - name: SAP_MessageProcessingLogID
      value: "{{messageId}}"
    - name: X-CPI-HeaderTest1
      value: TestValue
    - name: X-CPI-HeaderTest2
      value: 123-23123-23123
  body:
    type: xml
    data: |-
      <idoc>
        <metadata>
          <time>1234</time>
        </metadata>
        <body>TEST NEU !!</body>
      </idoc>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
